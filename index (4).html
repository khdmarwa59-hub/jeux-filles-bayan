<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd9ea"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IAVALIDÉ"><meta name="format-detection" content="telephone=no">
<title>IAVALIDÉ – السلسلة 5</title>
<style>
:root{--rose:#ff5fa2;--rose2:#c2377a;--berry:#6b1a45;--lilac:#c9a8ff;--card:rgba(255,255,255,.78);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--berry);background:linear-gradient(160deg,#ffe0ee 0%,#f4dcff 55%,#ffeaf4 100%) fixed;font:400 16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
.script{font-family:"Geeza Pro","Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",serif;font-weight:700}
.circles,.key,input{direction:ltr}
.fl{position:fixed;top:105vh;font-size:22px;opacity:.55;pointer-events:none;animation:up linear infinite;z-index:0}
@keyframes up{to{transform:translateY(-120vh) rotate(25deg)}}
#intro{position:fixed;inset:0;background:linear-gradient(160deg,#ff5fa2,#b658e0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;transition:opacity .9s}
#intro.out{opacity:0;pointer-events:none}
#intro img{display:block}
#sym{width:min(46vw,230px);clip-path:inset(100% 0 0 0);transform:scale(.86);filter:blur(9px);animation:rise 1.4s .3s cubic-bezier(.2,.8,.2,1) forwards,glow 1.6s 1.7s ease-in-out}
#ttl{width:min(62vw,300px);clip-path:inset(0 50% 0 50%);animation:wipe 1s 1.5s cubic-bezier(.2,.8,.2,1) forwards}
#sub{width:min(38vw,190px);opacity:0;animation:fade 1s 2.3s forwards}
#skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:none;border:0;color:#fff;opacity:.85;font:inherit;font-size:14px;letter-spacing:0;padding:12px}
@keyframes rise{to{clip-path:inset(0);transform:none;filter:none}}
@keyframes wipe{to{clip-path:inset(0)}}
@keyframes fade{to{opacity:1}}
@keyframes glow{50%{filter:drop-shadow(0 0 24px rgba(255,255,255,.9))}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,236,246,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #ffc2dc}
.logo{width:34px;height:32px;background:var(--rose2);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
header b{letter-spacing:.14em;font-size:14px;text-transform:uppercase}header span{display:block;font-size:12px;opacity:.7}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:22px 16px 70px}
.card{background:var(--card);border:1px solid #ffd0e4;border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(194,55,122,.14)}
.kick{display:inline-block;background:linear-gradient(90deg,var(--rose),var(--lilac));color:#fff;border-radius:999px;padding:3px 14px;font-size:13px;font-weight:700;letter-spacing:0}
h1{font-size:34px;line-height:1.15;margin:10px 0 4px;font-weight:400}
.sub{margin:0 0 6px;opacity:.8}
.circles{display:flex;gap:6px;justify-content:center;margin:8px 0}
.circles svg{width:32%;max-width:190px;height:auto;filter:drop-shadow(0 6px 8px rgba(194,55,122,.25))}
h2{font-size:18px;margin:0 0 10px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.key{background:#fff;border:1.5px solid #ffc2dc;border-radius:16px;text-align:center;padding:8px 4px;font-weight:700}
.key i{font-style:normal;color:var(--rose2);font-size:16px;margin:0 6px;font-weight:500}
.key b{font-size:20px}
details{margin-top:6px}summary{cursor:pointer;font-weight:600;color:var(--rose2);padding:10px 0;list-style:none}summary::-webkit-details-marker{display:none}
input{width:100%;font-size:22px;letter-spacing:.35em;text-align:center;text-transform:uppercase;border:2px solid #ffc2dc;border-radius:18px;padding:14px;background:#fff;color:var(--berry);font-family:inherit}
input:focus{outline:3px solid var(--lilac);border-color:var(--rose)}
.btn{margin-top:12px;width:100%;border:0;border-radius:999px;padding:15px;font-weight:700;font-size:16px;font-family:inherit;letter-spacing:0;color:#fff;background:linear-gradient(90deg,var(--rose),#b658e0);box-shadow:0 8px 20px rgba(182,88,224,.35);cursor:pointer}
.btn:active{transform:scale(.98)}
#res{min-height:56px;margin-top:14px;text-align:center;font-size:18px;font-weight:700;border-radius:16px;padding:12px;display:none}
#res.ok{display:block;background:#e6fff1;color:#116a3a;border:2px solid #7fe0a8}
#res.ko{display:block;background:#fff0f4;color:#b0204f;border:2px solid #ffa3bd;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cf{position:fixed;top:-30px;font-size:26px;z-index:40;pointer-events:none;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.tip{font-size:13px;opacity:.8}
@media (prefers-reduced-motion:reduce){.fl,.cf{display:none}#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>

  <p class="sub">كل عدد يخفي حرفًا. الأعداد الثلاثة الموجودة في <b>وسط</b> الدوائر تكوّن كلمة من 3 أحرف.</p>
  <div class="keys" id="keys"></div>
 </section>
 <section class="card">
  <h2 class="script" style="font-size:26px;font-weight:400">💌 إجابتك</h2>
  <label for="ans" class="sub">اكتب الكلمة المكوّنة من 3 أحرف (بالأحرف اللاتينية) :</label>
  <input id="ans" type="text" inputmode="text" maxlength="12" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="· · ·" enterkeyhint="done">
  <button class="btn" id="go">تحقّق ✨</button>
  <div id="res" role="status" aria-live="polite"></div>
 </section>
</main>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
// intro
var intro=$('#intro'),gone=false;
function endIntro(){if(gone)return;gone=true;intro.classList.add('out');setTimeout(function(){intro.remove()},950)}
$('#skip').onclick=endIntro;intro.onclick=endIntro;
setTimeout(endIntro,matchMedia('(prefers-reduced-motion:reduce)').matches?300:4300);
// décor flottant
var fl=$('#fl'),em=['💖','✨','🌸','🎀','💗','🌷'];
for(var i=0;i<12;i++){var s=document.createElement('span');s.className='fl';s.textContent=em[i%em.length];s.style.left=(Math.random()*95)+'vw';s.style.animationDuration=(14+Math.random()*14)+'s';s.style.animationDelay=(-Math.random()*20)+'s';fl.appendChild(s)}
// cercles : [haut-gauche, haut-droite, bas-gauche, bas-droite, centre]
var D=[[7,9,5,8,5],[6,15,2,11,18],[6,9,5,17,'?']],NS='http://www.w3.org/2000/svg';
function el(n,a,t){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e}
D.forEach(function(c){
  var s=el('svg',{viewBox:'0 0 220 220','aria-hidden':'true'});
  s.appendChild(el('circle',{cx:110,cy:110,r:104,fill:'#c2377a'}));
  s.appendChild(el('circle',{cx:110,cy:110,r:104,fill:'none',stroke:'#fff','stroke-width':3}));
  s.appendChild(el('line',{x1:110,y1:6,x2:110,y2:214,stroke:'#fff','stroke-width':3}));
  s.appendChild(el('line',{x1:6,y1:110,x2:214,y2:110,stroke:'#fff','stroke-width':3}));
  var p=[[66,78],[154,78],[66,150],[154,150]];
  for(var j=0;j<4;j++)s.appendChild(el('text',{x:p[j][0],y:p[j][1]+10,'text-anchor':'middle','font-size':36,'font-weight':700,fill:'#fff'},c[j]));
  s.appendChild(el('circle',{cx:110,cy:110,r:40,fill:c[4]==='?'?'#f1e4ff':'#fff',stroke:'#ffc2dc','stroke-width':3}));
  s.appendChild(el('text',{x:110,y:124,'text-anchor':'middle','font-size':42,'font-weight':800,fill:'#6b1a45'},c[4]));
  $('#circ').appendChild(s);
});
// guide : nombre -> lettre (ordre volontairement mélangé)
var K=[[12,'U'],[5,'V'],[21,'R'],[18,'A'],[3,'M'],[15,'I'],[9,'O'],[17,'S'],[7,'L'],[11,'E']];
K.forEach(function(k){var d=document.createElement('div');d.className='key';d.innerHTML='<b>'+k[0]+'</b><i>=</i><b style="color:#c2377a">'+k[1]+'</b>';$('#keys').appendChild(d)});
// vérification
var RESP='IAV';
function confetti(){for(var i=0;i<26;i++){var c=document.createElement('span');c.className='cf';c.textContent=em[i%em.length];c.style.left=(Math.random()*95)+'vw';c.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(c);(function(x){setTimeout(function(){x.remove()},3800)})(c)}}
function check(){
  var v=$('#ans').value.normalize('NFD').replace(/[^a-zA-Z]/g,'').toUpperCase(),r=$('#res');
  r.className='';
  if(!v){r.className='ko';r.textContent='اكتب إجابتك أولًا 💭';return}
  void r.offsetWidth;
  if(v===RESP){r.className='ok';r.textContent='✅ صحيح! إجابة رائعة 🎉';confetti()}
  else{r.className='ko';r.textContent='❌ خطأ… راجع الدليل وحاول مرة أخرى 💪'}
}
$('#go').onclick=check;
$('#ans').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();check();e.target.blur()}});
})();
</script></body></html>
